services:
  - type: web
    name: icollege-api
    runtime: node
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: npm ci
    preDeployCommand: npm run migrate
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGINS
        value: https://icollege-web.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: icollege-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: UPLOAD_DIR
        value: uploads

  - type: web
    name: icollege-web
    runtime: static
    region: frankfurt
    rootDir: frontend
    buildCommand: npm ci && npx expo export --platform web
    staticPublishPath: dist
    envVars:
      - key: EXPO_PUBLIC_API_URL
        value: https://icollege-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: icollege-db
    databaseName: icollege
    user: icollege
    region: frankfurt
    plan: free
    postgresMajorVersion: "17"
    ipAllowList: []
