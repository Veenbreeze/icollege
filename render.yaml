services:
  - type: web
    name: icollege-api
    runtime: node
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: npm ci
    preDeployCommand: npm run migrate
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: icollege-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: UPLOAD_DIR
        value: uploads

databases:
  - name: icollege-db
    databaseName: icollege
    user: icollege
    region: frankfurt
    plan: free
    postgresMajorVersion: "17"
    ipAllowList: []
